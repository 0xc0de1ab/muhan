# =============================================================================
#  [04] Build Docker Image — 소스에서 multi-arch 이미지 빌드
#
#  소스를 checkout 하여 linux/amd64, linux/arm64 멀티 아키텍처 이미지를 빌드하고
#  GHCR + OCI Registry 에 push 합니다. buildx + QEMU 크로스 컴파일.
# =============================================================================

name: "[04] Build Docker Image"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "이미지에 붙일 버전 (비우면 소스 VERSION 파일 사용, 예: 0.10.0-202606.1)"
        required: false
        type: string
      push_ghcr:
        description: "GHCR (ghcr.io) 에 Push"
        required: false
        type: boolean
        default: true
      push_oci:
        description: "OCI Registry 에 Push"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build & Push
    runs-on: ubuntu-latest
    env:
      OCI_REGISTRY: ${{ secrets.OCI_REGISTRY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            # 소스의 VERSION 파일이 진실의 원천 (release 바이너리에 의존 X)
            VERSION=$(cat VERSION | tr -d '[:space:]')
          fi
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"
          echo "build_date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"
          echo "Target: v${VERSION} (${COMMIT})"

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ─── GHCR 로그인 ───
      - name: Login to GHCR
        if: inputs.push_ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ─── OCI Registry Host 파싱 ───
      - name: Parse OCI Registry Host
        id: oci_host
        if: inputs.push_oci && env.OCI_REGISTRY != ''
        run: |
          # Extract only the domain/host from OCI_REGISTRY (e.g., icn.ocir.io/cnywk2t2q7tb -> icn.ocir.io)
          HOST=$(echo "${{ secrets.OCI_REGISTRY }}" | cut -d'/' -f1)
          echo "host=${HOST}" >> "$GITHUB_OUTPUT"
          echo "Parsed host: ${HOST}"

      # ─── OCI Registry 로그인 ───
      - name: Login to OCI Registry
        id: oci_login
        if: inputs.push_oci && env.OCI_REGISTRY != ''
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.oci_host.outputs.host }}
          username: ${{ secrets.OCI_REGISTRY_USER }}
          password: ${{ secrets.OCI_REGISTRY_PASSWORD }}

      # ─── Build & Push to GHCR ───
      - name: Build & Push to GHCR
        id: ghcr_push
        if: inputs.push_ghcr
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:v${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ steps.version.outputs.commit }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ─── Build & Push to OCI Registry ───
      - name: Build & Push to OCI Registry
        id: oci_push
        if: inputs.push_oci && env.OCI_REGISTRY != '' && steps.oci_login.outcome == 'success'
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.OCI_REGISTRY }}/muhan:v${{ steps.version.outputs.version }}
            ${{ env.OCI_REGISTRY }}/muhan:latest
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ steps.version.outputs.commit }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Job Summary
        env:
          OCI_REGISTRY: ${{ secrets.OCI_REGISTRY }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          {
            echo "## 🐳 Docker Image Build"
            echo ""
            echo "| | 값 |"
            echo "|---|---|"
            echo "| **버전** | \`v${VERSION}\` |"
            echo "| **소스 커밋** | [\`${{ steps.version.outputs.commit }}\`](https://github.com/${{ github.repository }}/commit/${{ steps.version.outputs.commit }}) |"
            echo "| **아키텍처** | linux/amd64, linux/arm64 |"
            echo "| **Dockerfile** | \`docker/Dockerfile.release\` |"
            echo ""
            echo "### 이미지 태그"
            echo ""
            echo "| Registry | 이미지 | Push |"
            echo "|----------|--------|------|"

            if [ "${{ inputs.push_ghcr }}" = "true" ]; then
              if [ "${{ steps.ghcr_push.outcome }}" = "success" ]; then
                echo "| GHCR | \`ghcr.io/${{ github.repository }}:v${VERSION}\` | ✅ 성공 |"
                echo "| GHCR | \`ghcr.io/${{ github.repository }}:latest\` | ✅ 성공 |"
              else
                echo "| GHCR | \`ghcr.io/${{ github.repository }}:v${VERSION}\` | ❌ 실패 |"
              fi
            else
              echo "| GHCR | — | ⏭ 스킵 |"
            fi

            if [ "${{ inputs.push_oci }}" = "true" ] && [ -n "$OCI_REGISTRY" ]; then
              if [ "${{ steps.oci_login.outcome }}" != "success" ]; then
                echo "| OCI | \`${OCI_REGISTRY}/muhan:v${VERSION}\` | ❌ 로그인 실패 (Push 건너뜀) |"
              elif [ "${{ steps.oci_push.outcome }}" = "success" ]; then
                echo "| OCI | \`${OCI_REGISTRY}/muhan:v${VERSION}\` | ✅ 성공 |"
                echo "| OCI | \`${OCI_REGISTRY}/muhan:latest\` | ✅ 성공 |"
              else
                echo "| OCI | \`${OCI_REGISTRY}/muhan:v${VERSION}\` | ❌ Push 실패 (권한 없음 등) |"
              fi
            else
              echo "| OCI | — | ⏭ 스킵 |"
            fi

            echo ""
            echo "### 🚀 Pull & Run 가이드"
            echo ""
            if [ "${{ inputs.push_ghcr }}" = "true" ] && [ "${{ steps.ghcr_push.outcome }}" = "success" ]; then
              echo "#### 1. GHCR 이미지 사용"
              echo "\`\`\`bash"
              echo "# 이미지 다운로드"
              echo "docker pull ghcr.io/${{ github.repository }}:v${VERSION}"
              echo ""
              echo "# 컨테이너 실행 (볼륨 마운트 및 포트 바인딩)"
              echo "docker run -d \\"
              echo "  --name muhan-server \\"
              echo "  -p 4000:4000 \\"
              echo "  -p 4041:4041 \\"
              echo "  -v ./data:/data \\"
              echo "  ghcr.io/${{ github.repository }}:v${VERSION}"
              echo "\`\`\`"
              echo ""
            fi

            if [ "${{ inputs.push_oci }}" = "true" ] && [ -n "$OCI_REGISTRY" ] && [ "${{ steps.oci_push.outcome }}" = "success" ]; then
              echo "#### 2. OCI Registry 이미지 사용"
              echo "\`\`\`bash"
              echo "# 이미지 다운로드"
              echo "docker pull ${OCI_REGISTRY}/muhan:v${VERSION}"
              echo ""
              echo "# 컨테이너 실행 (볼륨 마운트 및 포트 바인딩)"
              echo "docker run -d \\"
              echo "  --name muhan-server \\"
              echo "  -p 4000:4000 \\"
              echo "  -p 4041:4041 \\"
              echo "  -v ./data:/data \\"
              echo "  ${OCI_REGISTRY}/muhan:v${VERSION}"
              echo "\`\`\`"
              echo ""
            fi
          } >> "$GITHUB_STEP_SUMMARY"
